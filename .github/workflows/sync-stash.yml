name: Sync Stash Override

on:
  schedule:
    # 每天北京时间 04:00 (UTC 20:00) 自动拉取上游更新
    - cron: '0 20 * * *'
  push:
    branches: [ main ]
    paths:
      - 'rewrite.stoverride'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build stash.stoverride
        run: python3 scripts/build_stash.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain stash.stoverride)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stash.stoverride
            git commit -m "chore: auto-sync stash.stoverride from upstreams"
            git push
          else
            echo "No changes in stash.stoverride"
          fi
